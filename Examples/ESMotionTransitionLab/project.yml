name: ESMotionTransitionLab
options:
  bundleIdPrefix: dev.esmotion
  deploymentTarget:
    iOS: "26.0"
packages:
  ESMotion:
    path: ../..
targets:
  ESMotionTransitionLab:
    type: application
    platform: iOS
    sources:
      - ESMotionTransitionLab
    dependencies:
      - package: ESMotion
        product: ESMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esmotion.transitionlab
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CADisableMinimumFrameDurationOnPhone: YES
  ESMotionTransitionLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ESMotionTransitionLabUITests
    dependencies:
      - target: ESMotionTransitionLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esmotion.transitionlab.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ESMotionTransitionLab:
    build:
      targets:
        ESMotionTransitionLab: all
        ESMotionTransitionLabUITests: [test]
    test:
      targets:
        - ESMotionTransitionLabUITests
