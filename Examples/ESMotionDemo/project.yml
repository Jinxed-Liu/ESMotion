name: ESMotionDemo

options:
  bundleIdPrefix: dev.esmotion
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ESMotion:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ESMotionDemo:
    type: application
    platform: iOS
    sources:
      - path: ESMotionDemo
    dependencies:
      - package: ESMotion
        product: ESMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esmotion.demo
        PRODUCT_NAME: ESMotionDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ESMotion
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  ESMotionDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ESMotionDemoUITests
    dependencies:
      - target: ESMotionDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esmotion.demo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ESMotionDemo
        CODE_SIGN_STYLE: Automatic

schemes:
  ESMotionDemo:
    build:
      targets:
        ESMotionDemo: all
        ESMotionDemoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ESMotionDemoUITests
          parallelizable: false
