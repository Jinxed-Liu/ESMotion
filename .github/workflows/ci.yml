name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Resolve dependencies
        run: swift package resolve
      - name: Test
        run: swift test
      - name: Build iOS package
        run: >-
          xcodebuild -scheme ESMotion
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build CLI
        run: swift build --product esmotionc
      - name: Build Studio
        run: swift build --product ESMotionStudio
      - name: Build Gallery
        run: swift build --product ESMotionGallery
